name: Fuzz

# Feeds random and mutated files to the reader and random JSON to the writer.
# Weekly and on demand; a finding fails the run and is uploaded as artifact
# `fuzz-findings` (reproduce: cargo +nightly fuzz run <target> <file>). Leak
# detection is off: thread-local destructors of the xlsx writer show up as leaks.
on:
  schedule:
    - cron: '41 2 * * 0' # Sundays
  workflow_dispatch:
    inputs:
      minutes:
        description: Minutes per target
        default: '15'

permissions:
  contents: read

jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        target: [read, write]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: nightly
      - uses: taiki-e/install-action@893d6ee8d714b6c7dfe2bcd94e5759e9a7958a7e # v2.90.10
        with:
          tool: cargo-fuzz
      - name: Seed corpus
        run: |
          fuzz/seed-corpus.sh
          mkdir -p fuzz/corpus/write
          printf '[{"name":"S","columns":[{"header":"a","format":"date"}],"rows":[["ä",1,true,{"d":0},null]]}]' > fuzz/corpus/write/seed.json
      - name: Fuzz ${{ matrix.target }}
        working-directory: fuzz
        env:
          MINUTES: ${{ inputs.minutes || '15' }}
          TARGET: ${{ matrix.target }}
        run: |
          case "$MINUTES" in ''|*[!0-9]*) echo "minutes must be a number"; exit 1 ;; esac
          cargo fuzz run "$TARGET" "corpus/$TARGET" -- -max_total_time=$((MINUTES * 60)) -timeout=10 -rss_limit_mb=2560 -max_len=262144 -detect_leaks=0
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: fuzz-findings-${{ matrix.target }}
          path: fuzz/artifacts
