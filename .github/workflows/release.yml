name: Release

# Publishes the version in npm/package.json from main to npm (@10eputzen/excel-rs) with provenance
# and creates the GitHub release with tag v<version>. Start it by hand
# (workflow_dispatch) after the version bump is merged. The first publish uses
# the NPM_TOKEN secret of environment `npm`; once trusted publishing is set up
# on npmjs.com the secret can be removed and OIDC is used instead.
on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Only from main
        run: test "$GITHUB_REF" = refs/heads/main
      - id: v
        name: Version must not be released yet
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=$(node -p "require('./npm/package.json').version")
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v$v" >/dev/null 2>&1; then
            echo "v$v is already released, bump npm/package.json first"; exit 1
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    uses: ./.github/workflows/build-package.yml
    permissions:
      contents: read

  # Publish the tested tarball. Only this job gets the token and OIDC.
  publish:
    needs: [version, build]
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: write # GitHub release and tag
      id-token: write # npm provenance and trusted publishing
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: npm with trusted publishing
        run: npm install -g npm@11.6.2
      - run: npm publish ./*excel-rs-*.tgz --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: GitHub release
        run: gh release create "v$VERSION" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "v$VERSION" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
