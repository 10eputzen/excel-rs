name: Private release

# Publishes the version in npm/package.json from main to GitHub Packages as
# @<owner>/excel-rs, e.g. to test a version before the npm release. Consumers
# map the scope in .npmrc: @<owner>:registry=https://npm.pkg.github.com
on:
  workflow_dispatch:

permissions: {}

jobs:
  build:
    uses: ./.github/workflows/build-package.yml
    permissions:
      contents: read
    with:
      package-name: '@${{ github.repository_owner }}/excel-rs'

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com
      - run: npm publish ./*excel-rs-*.tgz
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
