name: Build package

# Builds and tests the npm package and uploads the tarball as artifact
# `package`. Runs without write access or secrets; callers publish it.
on:
  workflow_call:
    inputs:
      package-name:
        type: string
        default: excel-rs

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Commit must be on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
      - uses: taiki-e/install-action@893d6ee8d714b6c7dfe2bcd94e5759e9a7958a7e # v2.90.10
        with:
          tool: wasm-bindgen@0.2.130
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Check tag matches package version
        if: github.ref_type == 'tag'
        working-directory: npm
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - working-directory: npm
        run: npm ci --ignore-scripts
      - working-directory: npm
        run: npm run build
      - run: cargo test --locked
      - working-directory: npm
        run: npm test
      - name: Browser test (Chromium)
        working-directory: npm
        run: |
          npx playwright install --with-deps chromium
          npm run test:browser
      - name: Package name
        if: inputs.package-name != 'excel-rs'
        working-directory: npm
        run: npm pkg set name="$PACKAGE_NAME"
        env:
          PACKAGE_NAME: ${{ inputs.package-name }}
      - name: Pack
        working-directory: npm
        run: npm pack
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package
          path: npm/*excel-rs-*.tgz
          if-no-files-found: error
