version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      cargo:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /npm
    schedule:
      interval: weekly
    groups:
      npm:
        patterns: ["*"]
    ignore:
      # TypeScript 7 (native compiler) needs a migration of the build and
      # tsconfig; do it on purpose, not as a weekly bump.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      # Types must match the oldest supported Node.js (engines: >=20).
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: npm
    directory: /npm/bench
    schedule:
      interval: monthly
    groups:
      bench:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
