[workspace]
resolver = "2"
members = ["crates/core", "crates/wasm"]
exclude = ["fuzz"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/10eputzen/excel-rs"
rust-version = "1.88"

[workspace.dependencies]
calamine = "0.38"
rust_xlsxwriter = "0.104"
csv = "1.4"
encoding_rs = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = { version = "9", default-features = false }
quick-xml = "0.42"
cfb = "0.16"
wasm-bindgen = "=0.2.130"
proptest = { version = "1", default-features = false, features = ["std"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = "debuginfo"
